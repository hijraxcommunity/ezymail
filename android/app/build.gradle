apply plugin: 'com.android.application'

android {
    namespace = "af.ezy.mail"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "af.ezy.mail"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Gmail-style notification renderer (EzyMailMessagingService) compiles
    // against the same firebase-messaging version the push plugin uses
    implementation "com.google.firebase:firebase-messaging:25.0.1"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// google-services.json is gitignored and can silently go missing (sandbox
// resets, fresh clones). When it is absent the google-services plugin is
// skipped, FirebaseInitProvider never creates the default FirebaseApp, and
// PushNotificationsPlugin.register() CRASHED the app the moment the user
// allowed notifications (Task 76 root cause). A missing config must now
// fail the build LOUDLY instead of producing a crash-prone APK.
//
// Escape hatch: EzyMailApp.onCreate() initializes Firebase defensively from
// the public web config, so building with
//     -PallowMissingGoogleServices=true
// is safe (push delivery may be limited, but the app cannot crash).
def gsjsonFile = file('google-services.json')
if (gsjsonFile.exists() && gsjsonFile.text) {
    apply plugin: 'com.google.gms.google-services'
} else if (project.hasProperty('allowMissingGoogleServices')) {
    logger.warn("WARNING: google-services.json missing — building with defensive fallback Firebase init (EzyMailApp). Push delivery may be limited until the real config is added.")
} else {
    throw new GradleException("google-services.json is missing from android/app/. " +
        "Add it (Firebase console → Project settings → Android app af.ezy.mail → google-services.json) " +
        "or explicitly pass -PallowMissingGoogleServices=true to build with the defensive fallback init.")
}
